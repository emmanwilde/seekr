<!DOCTYPE html>
<html lang="en" data-theme="sunset">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEEKR</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='red'><path d='M13 2L3 14h9l-1 8 10-12h-9l1-8z'/></svg>">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-color: #010201;
      --text-color: #ffffff;
      --card-bg: rgba(1, 2, 1, 0.8);
      --border-color: #402fb5;
      --primary-color: #cf30aa;
      --secondary-color: #a099d8;
      --accent-color: #6e1b60;
      --input-bg: #010201;
    }

    [data-theme="light"] {
      --bg-color: #f5f5f7;
      --text-color: #333333;
      --card-bg: #ffffff;
      --border-color: #d1d5db;
      --primary-color: #5e81ac;
      --secondary-color: #4c6a8c;
      --accent-color: #88c0d0;
      --input-bg: #ffffff;
    }

    [data-theme="ocean"] {
      --bg-color: #0a1929;
      --text-color: #e0f2f1;
      --card-bg: rgba(10, 25, 41, 0.9);
      --border-color: #0077b6;
      --primary-color: #00b4d8;
      --secondary-color: #90e0ef;
      --accent-color: #023e8a;
      --input-bg: #0a1929;
    }

    [data-theme="forest"] {
      --bg-color: #1a2f1a;
      --text-color: #e8f5e9;
      --card-bg: rgba(26, 47, 26, 0.9);
      --border-color: #2e7d32;
      --primary-color: #4caf50;
      --secondary-color: #81c784;
      --accent-color: #1b5e20;
      --input-bg: #1a2f1a;
    }

    [data-theme="sunset"] {
      --bg-color: #1a0a0a;
      --text-color: #fff3e0;
      --card-bg: rgba(26, 10, 10, 0.9);
      --border-color: #bf360c;
      --primary-color: #ff5722;
      --secondary-color: #ffab91;
      --accent-color: #870000;
      --input-bg: #1a0a0a;
    }

    [data-theme="midnight"] {
      --bg-color: #0d0d0d;
      --text-color: #e0e0e0;
      --card-bg: rgba(20, 20, 20, 0.9);
      --border-color: #424242;
      --primary-color: #9e9e9e;
      --secondary-color: #bdbdbd;
      --accent-color: #212121;
      --input-bg: #0d0d0d;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text-color);
      overflow-x: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    .grid {
      height: 100vh;
      width: 100vw;
      background-image: linear-gradient(to right, var(--border-color) 1px, transparent 1px),
        linear-gradient(to bottom, var(--border-color) 1px, transparent 1px);
      background-size: 1rem 1rem;
      background-position: center center;
      position: fixed;
      z-index: -1;
      filter: blur(1px);
      opacity: 0.3;
    }

    .container {
      position: relative;
      z-index: 1;
      padding: 20px;
      width: 100%;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5rem;
      background: linear-gradient(90deg, #a099d8, #cf30aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .upload-section {
      display: flex;
      justify-content: center;
      margin-bottom: 40px;
    }

    .upload-btn-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      z-index: 100;
    }

    .btn {
      border: none;
      color: white;
      background-color: transparent;
      padding: 15px 40px;
      font-size: 18px;
      cursor: pointer;
      position: relative;
      width: 314px;
      height: 70px;
      border-radius: 12px;
      overflow: hidden;
    }

    .glow {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      filter: blur(30px);
      opacity: 0.4;
      z-index: -1;
    }

    .glow::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(60deg);
      width: 999px;
      height: 999px;
      background-image: conic-gradient(
        #000,
        #402fb5 5%,
        #000 38%,
        #000 50%,
        #cf30aa 60%,
        #000 87%
      );
    }

    .darkBorderBg {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 12px;
      overflow: hidden;
      z-index: -2;
    }

    .darkBorderBg::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(82deg);
      width: 600px;
      height: 600px;
      background-image: conic-gradient(
        rgba(0, 0, 0, 0),
        #18116a,
        rgba(0, 0, 0, 0) 10%,
        rgba(0, 0, 0, 0) 50%,
        #6e1b60,
        rgba(0, 0, 0, 0) 60%
      );
    }

    .white {
      position: absolute;
      top: 3px;
      left: 3px;
      right: 3px;
      bottom: 3px;
      border-radius: 10px;
      overflow: hidden;
      z-index: -1;
      filter: blur(2px);
    }

    .white::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(83deg);
      width: 600px;
      height: 600px;
      background-image: conic-gradient(
        rgba(0, 0, 0, 0) 0%,
        #a099d8,
        rgba(0, 0, 0, 0) 8%,
        rgba(0, 0, 0, 0) 50%,
        #dfa2da,
        rgba(0, 0, 0, 0) 58%
      );
      filter: brightness(1.4);
    }

    .border {
      position: absolute;
      top: 5px;
      left: 5px;
      right: 5px;
      bottom: 5px;
      border-radius: 11px;
      overflow: hidden;
      z-index: -1;
    }

    .border::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(70deg);
      width: 600px;
      height: 600px;
      background-image: conic-gradient(
        #1c191c,
        #402fb5 5%,
        #1c191c 14%,
        #1c191c 50%,
        #cf30aa 60%,
        #1c191c 64%
      );
      filter: brightness(1.3);
    }

    .btn-text {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn:hover .darkBorderBg::before,
    .btn:hover .glow::before,
    .btn:hover .white::before,
    .btn:hover .border::before {
      transform: translate(-50%, -50%) rotate(260deg);
      transition: all 2s;
    }

    .upload-btn-wrapper {
      position: relative;
      overflow: hidden;
    }

    .upload-btn-wrapper input[type=file] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    .table-container {
      overflow-x: auto;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
    }

    .clickable-cell {
      cursor: pointer;
      user-select: none;
      transition: color 0.2s, text-shadow 0.2s;
    }

    .clickable-cell:hover {
      color: var(--primary-color);
      text-shadow: 0 0 10px rgba(207, 48, 170, 0.5);
    }

    .clickable-cell.copied {
      color: #28a745;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th, td {
      padding: 15px 20px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background: var(--card-bg);
      color: var(--secondary-color);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 14px;
      letter-spacing: 1px;
      position: sticky;
      top: 0;
    }

    tr:hover td {
      background: rgba(64, 47, 181, 0.1);
    }

    td {
      color: var(--text-color);
    }

    tr:nth-child(even) td {
      background: var(--bg-color);
    }

    .no-data {
      text-align: center;
      padding: 60px;
      color: var(--accent-color);
      font-size: 18px;
    }

    .file-info {
      text-align: center;
      margin-bottom: 20px;
      color: #a099d8;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
      gap: 20px;
    }

    .navbar-brand {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary-color);
      text-decoration: none;
      white-space: nowrap;
    }

    .navbar-search {
      display: flex;
      gap: 10px;
      flex: 1;
      justify-content: center;
      max-width: 800px;
    }

    .navbar-search input {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      background: var(--input-bg);
      color: var(--text-color);
      font-size: 13px;
      width: 200px;
    }

    .navbar-search input::placeholder {
      color: var(--accent-color);
    }

    .navbar-search input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 10px rgba(207, 48, 170, 0.3);
    }

    .navbar-datetime {
      color: var(--secondary-color);
      font-size: 2.4rem;
      white-space: nowrap;
    }

    .theme-switcher {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: 20px;
    }

    .theme-switcher select {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      background: var(--input-bg);
      color: var(--text-color);
      font-size: 14px;
      cursor: pointer;
    }

    .theme-switcher select:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    .brand-animation {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pyramid-loader {
      position: relative;
      width: 60px;
      height: 60px;
      display: block;
      transform-style: preserve-3d;
      transform: rotateX(-20deg);
    }

    .pyramid-loader .wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      animation: spin 4s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotateY(360deg);
      }
    }

    .pyramid-loader .wrapper .side {
      width: 25px;
      height: 25px;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      margin: auto;
      transform-origin: center top;
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }

    .pyramid-loader .wrapper .side1 {
      transform: rotateZ(-30deg) rotateY(90deg);
      background: conic-gradient(#00FFFF, #00CED1, #20B2AA, #008B8B);
    }

    .pyramid-loader .wrapper .side2 {
      transform: rotateZ(30deg) rotateY(90deg);
      background: conic-gradient(#008B8B, #20B2AA, #00CED1, #00FFFF);
    }

    .pyramid-loader .wrapper .side3 {
      transform: rotateX(30deg);
      background: conic-gradient(#008B8B, #20B2AA, #00CED1, #00FFFF);
    }

    .pyramid-loader .wrapper .side4 {
      transform: rotateX(-30deg);
      background: conic-gradient(#00FFFF, #00CED1, #20B2AA, #008B8B);
    }

    .pyramid-loader .wrapper .shadow {
      width: 20px;
      height: 20px;
      background: #8B5AD5;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      margin: auto;
      transform: rotateX(90deg) translateZ(-40px);
      filter: blur(12px);
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .nav-tab {
      padding: 10px 20px;
      border: 1px solid #402fb5;
      background: transparent;
      color: #a099d8;
      cursor: pointer;
      border-radius: 5px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .nav-tab:hover {
      background: rgba(64, 47, 181, 0.3);
    }

    .nav-tab.active {
      background: #402fb5;
      color: white;
      border-color: #402fb5;
    }

    .inventory-sections-container {
      display: grid;
      grid-template-columns: 50% 50%;
      gap: 20px;
      width: 100%;
    }

    .inventory-section {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .inventory-section h2 {
      text-align: center;
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 10px;
      margin-bottom: 15px;
      color: var(--secondary-color);
    }

    .stock-info {
      text-align: center;
      font-size: 0.9em;
      color: var(--accent-color);
      margin-top: -10px;
      margin-bottom: 15px;
    }

    .inventory-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
    }

    .inventory-filters input {
      flex: 1;
      min-width: 150px;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      background: var(--input-bg);
      color: var(--text-color);
      font-size: 14px;
    }

    .inventory-filters input::placeholder {
      color: var(--accent-color);
    }

    .inventory-filters input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 10px rgba(207, 48, 170, 0.3);
    }

    .import-btn {
      padding: 10px 20px;
      border: 1px solid var(--primary-color);
      background: transparent;
      color: var(--primary-color);
      cursor: pointer;
      border-radius: 5px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .import-btn:hover {
      background: var(--primary-color);
      color: var(--bg-color);
    }

    .table-section {
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  
  <nav class="navbar">
    <div class="brand-animation">
      <div class="pyramid-loader">
        <div class="wrapper">
          <span class="side side1"></span>
          <span class="side side2"></span>
          <span class="side side3"></span>
          <span class="side side4"></span>
          <span class="shadow"></span>
        </div>
      </div>
      <a href="#" class="navbar-brand">SEEKR by EMS</a>
    </div>
    <div class="navbar-search">
      <input type="text" id="nav-item-code-filter" placeholder="Filter by Item Code...">
      <input type="text" id="nav-desc-filter-1" placeholder="Filter by Description 1...">
      <input type="text" id="nav-desc-filter-2" placeholder="Filter by Description 2...">
    </div>
    <div class="navbar-datetime" id="navbar-datetime"></div>
    <div class="theme-switcher">
      <select id="theme-select">
        <option value="sunset" selected>Sunset</option>
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="ocean">Ocean</option>
        <option value="forest">Forest</option>
        <option value="midnight">Midnight</option>
      </select>
    </div>
  </nav>
  
  <div class="container">
    <div class="inventory-sections-container">
      <div class="inventory-section">
        <h2>BRANCH STOCK</h2>
        <p class="stock-info" id="branch-file-info">No file loaded</p>
        <div class="inventory-filters">
          <input type="text" id="item-code-filter" placeholder="Filter by Item Code...">
          <input type="text" id="desc-filter-1" placeholder="Filter by Description (1)...">
          <input type="text" id="desc-filter-2" placeholder="Filter by Description (2)...">
        </div>
        <div class="inventory-filters">
          <div class="upload-btn-wrapper">
            <button class="import-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
              IMPORT
            </button>
            <input type="file" id="fileInput" accept=".xls,.xlsx" />
          </div>
        </div>
        <div class="table-container" id="tableContainer">
          <table>
            <thead>
              <tr>
                <th>ITEM CODE</th>
                <th>DESCRIPTION</th>
                <th>QTY</th>
              </tr>
            </thead>
            <tbody id="stock-table-body">
              <tr>
                <td colspan="3" class="no-data">Upload an XLS file to view contents</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="inventory-section">
        <h2>WHS STOCK</h2>
        <p class="stock-info" id="whs-file-info">No file loaded</p>
        <div class="inventory-filters">
          <input type="text" id="whs-item-code-filter" placeholder="Filter by Item Code...">
          <input type="text" id="whs-desc-filter-1" placeholder="Filter by Description (1)...">
          <input type="text" id="whs-desc-filter-2" placeholder="Filter by Description (2)...">
        </div>
        <div class="inventory-filters">
          <div class="upload-btn-wrapper">
            <button class="import-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
              IMPORT
            </button>
            <input type="file" id="whs-fileInput" accept=".xls,.xlsx" />
          </div>
        </div>
        <div class="table-container" id="whs-tableContainer">
          <table>
            <thead>
              <tr>
                <th>ITEM CODE</th>
                <th>DESCRIPTION</th>
                <th>QTY</th>
              </tr>
            </thead>
            <tbody id="whs-stock-table-body">
              <tr>
                <td colspan="3" class="no-data">Upload an XLS file to view contents</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    if (typeof XLSX === 'undefined') {
      console.log('Warning: XLSX library not loaded');
    }

    let stockData = [];
    let whsData = [];

    const fileInput = document.getElementById('fileInput');
    const whsFileInput = document.getElementById('whs-fileInput');
    const stockTableBody = document.getElementById('stock-table-body');
    const whsStockTableBody = document.getElementById('whs-stock-table-body');
    const branchFileInfo = document.getElementById('branch-file-info');
    const whsFileInfo = document.getElementById('whs-file-info');

    fileInput.addEventListener('change', (e) => handleFile(e, 'branch'));
    whsFileInput.addEventListener('change', (e) => handleFile(e, 'whs'));

    function handleFile(e, type) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = function(e) {
        try {
          let workbook;
          if (file.name.toLowerCase().endsWith('.xls') && !file.name.toLowerCase().endsWith('.xlsx')) {
            const binaryString = Array.from(new Uint8Array(e.target.result)).map(b => String.fromCharCode(b)).join('');
            workbook = XLSX.read(binaryString, { type: 'binary', cellDates: true });
          } else {
            workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
          }

          if (!workbook.SheetNames || workbook.SheetNames.length === 0) {
            alert('No sheets found in workbook');
            return;
          }

          const worksheet = workbook.Sheets[workbook.SheetNames[0]];
          if (!worksheet) {
            alert('Could not read sheet');
            return;
          }

          const branchName = worksheet['A1'] ? worksheet['A1'].v : '';
          const dateTime = worksheet['A4'] ? worksheet['A4'].v : '';

          const items = [];
          for (let row = 9; row <= 1000; row++) {
            const itemCode = worksheet['A' + row] ? worksheet['A' + row].v : null;
            const itemDesc = worksheet['B' + row] ? worksheet['B' + row].v : null;
            const quantity = worksheet['E' + row] ? worksheet['E' + row].v : null;

            if (itemCode === null && itemDesc === null && quantity === null) break;
            if (itemCode || itemDesc || quantity) {
              items.push({ itemCode, itemDesc, quantity });
            }
          }

          if (type === 'branch') {
            stockData = items;
            branchFileInfo.textContent = `${file.name} - ${dateTime}`;
            renderStockTable(stockData);
          } else {
            whsData = items;
            whsFileInfo.textContent = `${file.name} - ${dateTime}`;
            renderWHSStockTable(whsData);
          }
        } catch (err) {
          console.error('Error parsing file:', err);
          alert('Error parsing file: ' + err.message);
        }
      };

      reader.readAsArrayBuffer(file);
    }

    function renderStockTable(data) {
      if (!data || data.length === 0) {
        stockTableBody.innerHTML = '<tr><td colspan="3" class="no-data">No data found</td></tr>';
        return;
      }
      let html = '';
      data.forEach(row => {
        const itemCode = escapeHtml(String(row.itemCode || ''));
        const itemDesc = escapeHtml(String(row.itemDesc || ''));
        html += `<tr>
          <td class="clickable-cell" onclick="copyToClipboard('${itemCode}', this)">${itemCode}</td>
          <td class="clickable-cell" onclick="copyToClipboard('${itemDesc.replace(/'/g, "\\'")}', this)">${itemDesc}</td>
          <td>${escapeHtml(String(row.quantity || ''))}</td>
        </tr>`;
      });
      stockTableBody.innerHTML = html;
    }

    function renderWHSStockTable(data) {
      if (!data || data.length === 0) {
        whsStockTableBody.innerHTML = '<tr><td colspan="3" class="no-data">No data found</td></tr>';
        return;
      }
      let html = '';
      data.forEach(row => {
        const itemCode = escapeHtml(String(row.itemCode || ''));
        const itemDesc = escapeHtml(String(row.itemDesc || ''));
        html += `<tr>
          <td class="clickable-cell" onclick="copyToClipboard('${itemCode}', this)">${itemCode}</td>
          <td class="clickable-cell" onclick="copyToClipboard('${itemDesc.replace(/'/g, "\\'")}', this)">${itemDesc}</td>
          <td>${escapeHtml(String(row.quantity || ''))}</td>
        </tr>`;
      });
      whsStockTableBody.innerHTML = html;
    }

    function copyToClipboard(text, element) {
      const originalText = element.textContent;
      navigator.clipboard.writeText(text).then(() => {
        element.textContent = 'Copied!';
        element.classList.add('copied');
        setTimeout(() => {
          element.textContent = originalText;
          element.classList.remove('copied');
        }, 500);
      });
    }

    document.getElementById('item-code-filter').addEventListener('input', filterStockTable);
    document.getElementById('desc-filter-1').addEventListener('input', filterStockTable);
    document.getElementById('desc-filter-2').addEventListener('input', filterStockTable);
    document.getElementById('whs-item-code-filter').addEventListener('input', filterWHSStockTable);
    document.getElementById('whs-desc-filter-1').addEventListener('input', filterWHSStockTable);
    document.getElementById('whs-desc-filter-2').addEventListener('input', filterWHSStockTable);

    function filterStockTable() {
      const codeFilter = document.getElementById('item-code-filter').value.toLowerCase();
      const desc1Filter = document.getElementById('desc-filter-1').value.toLowerCase();
      const desc2Filter = document.getElementById('desc-filter-2').value.toLowerCase();

      const filtered = stockData.filter(row => {
        const code = String(row.itemCode || '').toLowerCase();
        const desc = String(row.itemDesc || '').toLowerCase();
        return code.includes(codeFilter) && desc.includes(desc1Filter) && desc.includes(desc2Filter);
      });

      renderStockTable(filtered);
    }

    function filterWHSStockTable() {
      const codeFilter = document.getElementById('whs-item-code-filter').value.toLowerCase();
      const desc1Filter = document.getElementById('whs-desc-filter-1').value.toLowerCase();
      const desc2Filter = document.getElementById('whs-desc-filter-2').value.toLowerCase();

      const filtered = whsData.filter(row => {
        const code = String(row.itemCode || '').toLowerCase();
        const desc = String(row.itemDesc || '').toLowerCase();
        return code.includes(codeFilter) && desc.includes(desc1Filter) && desc.includes(desc2Filter);
      });

      renderWHSStockTable(filtered);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function updateDateTime() {
      const now = new Date();
      const options = { 
        weekday: 'short', 
        year: 'numeric', 
        month: 'short', 
        day: '2-digit',
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit',
        hour12: false 
      };
      document.getElementById('navbar-datetime').textContent = now.toLocaleString('en-US', options);
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    document.getElementById('nav-item-code-filter').addEventListener('input', filterBothTables);
    document.getElementById('nav-desc-filter-1').addEventListener('input', filterBothTables);
    document.getElementById('nav-desc-filter-2').addEventListener('input', filterBothTables);

    function filterBothTables() {
      const codeFilter = document.getElementById('nav-item-code-filter').value.toLowerCase();
      const desc1Filter = document.getElementById('nav-desc-filter-1').value.toLowerCase();
      const desc2Filter = document.getElementById('nav-desc-filter-2').value.toLowerCase();

      const filteredBranch = stockData.filter(row => {
        const code = String(row.itemCode || '').toLowerCase();
        const desc = String(row.itemDesc || '').toLowerCase();
        return code.includes(codeFilter) && desc.includes(desc1Filter) && desc.includes(desc2Filter);
      });

      const filteredWHS = whsData.filter(row => {
        const code = String(row.itemCode || '').toLowerCase();
        const desc = String(row.itemDesc || '').toLowerCase();
        return code.includes(codeFilter) && desc.includes(desc1Filter) && desc.includes(desc2Filter);
      });

      renderStockTable(filteredBranch);
      renderWHSStockTable(filteredWHS);
    }

    document.getElementById('theme-select').addEventListener('change', function() {
      document.documentElement.setAttribute('data-theme', this.value);
    });
  </script>
</body>
</html>
